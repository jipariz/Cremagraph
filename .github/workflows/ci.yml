name: ci

# The full build on main: tests, screenshots, every platform, the export checks and the web deploy. Pull requests get
# the quicker checks in pr.yml, on the self-hosted Mac.
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (shared code on the JVM)
        run: ./gradlew testAndroidHostTest --stacktrace
      - name: Screenshot tests (layoutlib on the JVM, no device)
        run: ./gradlew :screenshots:verifyMugshot --stacktrace
      # The phone app and the editor driven through their test tags at phone, tablet and foldable sizes, exporting
      # through FFmpeg; and the desktop app as main starts it.
      - name: UI tests (the apps' flows on the JVM)
        run: ./gradlew :uitests:desktopTest :app:desktopApp:test --stacktrace
      - name: UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            uitests/build/reports/tests/desktopTest/
            app/desktopApp/build/reports/tests/test/
      # Golden, actual and the changed pixels in red: without these a failure here is only
      # reproducible locally.
      - name: Screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            screenshots/build/reports/tests/mugshotTestAndroidMain/
            screenshots/build/mugshot/failures/
      - name: Build debug app
        run: ./gradlew :app:androidApp:assembleDebug --stacktrace
      - name: Build the web editor
        run: ./gradlew :app:webApp:composeCompatibilityBrowserDistribution --stacktrace
      # The built site in headless Chromium, on the wasm build and the Kotlin/JS fallback: it loads, hands over from
      # the splash, draws, and logs no errors.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web smoke test
        working-directory: tools/web-smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node smoke.mjs
      # Every green push to main goes live at https://onlyshots.vercel.app. Vercel builds nothing itself
      # (the project's Ignored Build Step is `exit 0`); this uploads the distribution built above.
      - name: Deploy the web editor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_rT4QKrRdpu5Q5xCNiLKBKv97
          VERCEL_PROJECT_ID: prj_IvSpiUV634RsxbGtn91xN0FPonLO
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The VERCEL_TOKEN repository secret is not set; the web editor cannot be deployed."
            exit 1
          fi
          npm install --global vercel@latest
          tools/deploy-web.sh --skip-build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: ktfmt
        run: ./gradlew ktfmtCheck --stacktrace
      - name: The iOS project carries onlyshots.version
        run: ./gradlew checkAppVersion --stacktrace

  android-export:
    # Milestone 1 spike: real Media3 export of the test clip, alignment checked on decoded frames.
    # Emulator codecs are software, so the timing it logs says nothing about phones. Then the installed app's smoke
    # tests (UI Automator): the sample shot recorded with the emulator's camera, exported, saved; Open; rotation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: ./gradlew :video:connectedAndroidDeviceTest :app:uitests:connectedAndroidTest --stacktrace

  # iPhone Duo goldens (tools/ios-screenshots/run.sh), as in pr.yml: the iPhone Duo simulator needs Xcode 27.1, which
  # only the self-hosted Mac has.
  duo-screenshots:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Homebrew on the PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: iPhone Duo screenshot tests
        run: tools/ios-screenshots/run.sh
      - name: iPhone Duo screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duo-screenshot-report
          path: app/iosApp/build/duo-screenshots/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests and the export test on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test --stacktrace
      # Builds the app (its pre-build phase builds the Kotlin module through Swift export) and runs its smoke tests (XCUITest, iosAppUITests) with the camera and microphone already
      # allowed, so no system prompt stands over it.
      - name: Build the iOS app and run its UI tests
        run: |
          brew install xcodegen
          (cd app/iosApp && xcodegen generate)
          xcrun simctl boot 'iPhone 17' || true
          xcrun simctl privacy 'iPhone 17' grant camera dev.parez.onlyshots
          xcrun simctl privacy 'iPhone 17' grant microphone dev.parez.onlyshots
          xcodebuild -project app/iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' test
