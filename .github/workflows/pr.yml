name: pr

# Every pull request: formatting, the version check, the shared tests, the screenshot tests and the UI tests; on
# branch PRs also the iPhone Duo screenshot tests.
# PRs from this repository's branches run on our self-hosted Mac (labels self-hosted, macOS, ARM64). PRs from forks run
# on a GitHub-hosted runner instead, so a stranger's code never runs on that machine.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The self-hosted Mac's runner user has no Android SDK of its own (GitHub's runners do): install it and accept
      # the licenses, so AGP can fetch what the build needs.
      - uses: android-actions/setup-android@v3
        with:
          # Its default list still names `tools`, which the current sdkmanager no longer has. AGP fetches the
          # platform and build tools itself.
          packages: platform-tools
      - name: ktfmt
        run: ./gradlew ktfmtCheck --stacktrace
      - name: The iOS project carries onlyshots.version
        run: ./gradlew checkAppVersion --stacktrace
      - name: Unit tests (shared code on the JVM)
        run: ./gradlew testAndroidHostTest --stacktrace
      - name: Screenshot tests (layoutlib on the JVM, no device)
        run: ./gradlew :screenshots:verifyMugshot --stacktrace
      # The phone app and the editor driven through their test tags at phone, tablet and foldable sizes, exporting
      # through FFmpeg; and the desktop app as main starts it.
      - name: UI tests (the apps' flows on the JVM)
        run: ./gradlew :uitests:desktopTest :app:desktopApp:test --stacktrace
      - name: UI test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            uitests/build/reports/tests/desktopTest/
            app/desktopApp/build/reports/tests/test/
      # Golden, actual and the changed pixels in red: without these a failure is only reproducible locally.
      - name: Screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-report
          path: |
            screenshots/build/reports/tests/mugshotTestAndroidMain/
            screenshots/build/mugshot/failures/

  # iPhone Duo goldens (tools/ios-screenshots/run.sh): the whole screen as the system shows it, closed, open and
  # half-open. The iPhone Duo simulator needs Xcode 27.1, which only the self-hosted Mac has, so branch PRs only: a fork's
  # PR skips it.
  duo-screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The app's pre-build phase builds the Kotlin module through Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # xcodegen and npm (for mobilecli, which folds the simulator) are Homebrew's, outside the runner user's PATH.
      - name: Homebrew on the PATH
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - name: iPhone Duo screenshot tests
        run: tools/ios-screenshots/run.sh
      # The new pictures and the changed pixels in red, plus every screen in the result bundles.
      - name: iPhone Duo screenshot report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duo-screenshot-report
          path: app/iosApp/build/duo-screenshots/
