name: iosApp
options:
  bundleIdPrefix: dev.parez
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "10100"
    # Kotlin builds no iosX64: Swift export refuses an Xcode request for it ("Any iOS Simulator Device").
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    # No `info:` block: xcodegen would overwrite the handwritten Info.plist, and with it the
    # camera, microphone, local-network and Bluetooth usage strings.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parez.onlyshots
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/iosApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        # The Kotlin module (Swift export: `import OnlyShotsApp`) is built and put in the products by the Gradle phase
        # below, which writes outside the sandbox.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the Kotlin module
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :app:shared:embedSwiftExportForXcode
  # End-to-end smoke tests of the installed app (XCUITest), finding controls by their Compose test tags, which iOS
  # shows as accessibility identifiers (app.onlyshots.TestTags):
  #   xcodebuild test -project iosApp.xcodeproj -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 16'
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iosAppUITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.parez.onlyshots.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: iosApp
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
        iosAppUITests: [test]
    test:
      targets:
        - iosAppUITests
