<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OnlyShots — web editor</title>
    <!-- From design/logo/kit/web/head-snippet.html. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B0B0B" />
    <!-- The link preview (Discord, Slack, X, iMessage, WhatsApp…). Crawlers run no script: these tags must stay in the
         page itself. Images from design/social (render.py); image URLs must be absolute. -->
    <meta name="description" content="Film espresso with the live graph from your machine and scale. Line it up, style it, export MP4. Free, in your browser." />
    <link rel="canonical" href="https://onlyshots.parez.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlyShots" />
    <meta property="og:title" content="OnlyShots — web editor" />
    <meta property="og:description" content="Film espresso with the live graph from your machine and scale. Line it up, style it, export MP4. Free, in your browser." />
    <meta property="og:url" content="https://onlyshots.parez.dev/" />
    <meta property="og:image" content="https://onlyshots.parez.dev/social/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An espresso shot pouring on a Gaggiuino, with its pressure, flow and weight graph beside it." />
    <meta property="og:image" content="https://onlyshots.parez.dev/social/og-square.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="An espresso shot pouring on a Gaggiuino, with its pressure, flow and weight graph over it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://onlyshots.parez.dev/social/og-16x9.jpg" />
    <meta name="twitter:image:alt" content="An espresso shot pouring on a Gaggiuino, with its pressure, flow and weight graph beside it." />
    <!-- Safari's own "Open / View" banner for the iPhone app; switch on with the App Store id (see AppStores.kt). -->
    <!-- <meta name="apple-itunes-app" content="app-id=REPLACE_WITH_APP_STORE_ID" /> -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0b; overflow: hidden; }
      /* The editor's own place: Compose takes over the element it is given, and the splash must outlive that. */
      #app { position: fixed; inset: 0; }
      #splash { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
                background: #0b0b0b; pointer-events: none; }
      /* 146 px, as the apps draw it (design/splash/avd.py). */
      #splash svg { width: 146px; height: 146px; overflow: visible; }
    </style>
    <script type="module" src="media.js"></script>
    <script type="application/javascript" src="onlyshots.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- The splash (design/splash/SPEC.md): drawn by the page itself, long before the app's code has loaded. The signal
         tile wipes in; the pen, the head on its stem, stands up at its edge as a playhead and sweeps through the shot,
         the trace drawn behind it. Until the app says it has drawn its first frame (onlyshotsReady) the playhead runs
         back and sweeps again. Then the head pulses once, a ring going out from it, and the splash fades into the
         editor. Reduced motion: the finished mark, still. -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 256 256">
        <g id="mark">
          <rect id="tile" x="32" y="32" width="0" height="192" fill="#FF5A1F"/>
          <path id="trace" d="M32 166 H80 C110 166 110 100 140 100 H156" fill="none" stroke="#0B0B0B" stroke-width="20"
                stroke-linecap="butt" stroke-linejoin="round"/>
          <path id="rail" d="M32 166 H80 C110 166 110 100 140 100 H172" fill="none" stroke="none"/>
          <rect id="stem" x="166" y="116" width="12" height="0" fill="#0B0B0B"/>
          <rect id="head" x="156" y="84" width="0" height="0" fill="#0B0B0B"/>
          <rect id="ring" x="156" y="84" width="32" height="32" fill="none" stroke="#0B0B0B" stroke-width="5" opacity="0"/>
        </g>
      </svg>
    </div>
    <script>
      (function () {
        var el = document.getElementById('splash'), mark = document.getElementById('mark');
        var tile = document.getElementById('tile'), trace = document.getElementById('trace');
        var rail = document.getElementById('rail'), stem = document.getElementById('stem');
        var head = document.getElementById('head'), ring = document.getElementById('ring');
        var L = trace.getTotalLength(), R = rail.getTotalLength();
        trace.style.strokeDasharray = L;
        // The timeline (ms) and easings of design/splash/motion.py, as in the app (SplashMark.kt).
        var P = { wipe: [0, 260], land: [220, 380], draw: [380, 1100], pulse: 300, exit: 350 };
        var LOOP = { hold: 200, back: 250, draw: 720 };
        function bezier(x1, y1, x2, y2) {
          function at(t, a, b) { var u = 1 - t; return 3 * u * u * t * a + 3 * u * t * t * b + t * t * t; }
          return function (x) {
            if (x <= 0) return 0;
            if (x >= 1) return 1;
            var lo = 0, hi = 1;
            for (var i = 0; i < 30; i++) { var m = (lo + hi) / 2; if (at(m, x1, x2) < x) lo = m; else hi = m; }
            return at((lo + hi) / 2, y1, y2);
          };
        }
        var E = { wipe: bezier(.33, 1, .68, 1), land: bezier(.34, 1.6, .64, 1), draw: bezier(.37, 0, .63, 1),
                  ring: bezier(.33, 1, .68, 1), exit: bezier(.65, 0, .35, 1) };
        function seg(t, a, b) { return Math.min(1, Math.max(0, (t - a) / (b - a))); }
        var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        // The splash's own clock: it moves at most a frame at a time, so while the browser is busy starting the app
        // (compiling and running the wasm blocks this page for a moment) the animation waits instead of jumping ahead.
        var clock = 0, last = -1, loaded = false, doneAt = -1;
        // How far the playhead has swept at t. The first sweep follows P; after it, while the app loads, each cycle
        // holds the swept mark, runs the playhead back (the trace trims back behind it) and sweeps again.
        function sweep(t) {
          if (t < P.draw[1]) return E.draw(seg(t, P.draw[0], P.draw[1]));
          if (loaded && doneAt >= 0) return 1;
          var c = (t - P.draw[1]) % (LOOP.hold + LOOP.back + LOOP.draw);
          if (c < LOOP.hold) return 1;
          c -= LOOP.hold;
          if (c < LOOP.back) return 1 - E.draw(c / LOOP.back);
          return E.draw(seg(c - LOOP.back, 0, LOOP.draw));
        }
        function render(t) {
          tile.setAttribute('width', 192 * E.wipe(seg(t, P.wipe[0], P.wipe[1])));
          var d = sweep(t);
          // The app has drawn: the first time the playhead is at the pen from then on, the pulse and the fade start.
          if (loaded && doneAt < 0 && d >= 1) doneAt = t;
          trace.style.strokeDashoffset = L * (1 - d);
          trace.style.opacity = d > 0.002 ? 1 : 0;
          var land = E.land(seg(t, P.land[0], P.land[1]));
          var k = doneAt >= 0 ? seg(t, doneAt, doneAt + P.pulse) : 0, pulsing = k > 0 && k < 1;
          var bump = pulsing ? Math.sin(Math.PI * Math.min(1, k * 1.6)) * 0.25 : 0;
          var s = 32 * land * (1 + bump);
          var at = rail.getPointAtLength(Math.min(R, (R - 16) * d + 16));
          var x = Math.max(at.x, 32 + s / 2);
          head.setAttribute('x', x - s / 2); head.setAttribute('y', at.y - s / 2);
          head.setAttribute('width', s); head.setAttribute('height', s);
          // The playhead's stem stands under the head wherever it is, down to the stem's foot.
          stem.setAttribute('x', at.x - 6); stem.setAttribute('y', at.y + 16);
          stem.setAttribute('height', Math.max(0, 196 - (at.y + 16)) * Math.min(1, land));
          var r = 32 + 40 * E.ring(k);
          ring.setAttribute('x', at.x - r / 2); ring.setAttribute('y', at.y - r / 2);
          ring.setAttribute('width', r); ring.setAttribute('height', r);
          ring.setAttribute('opacity', pulsing ? 0.85 * (1 - E.ring(k)) : 0);
          // The editor's first screen has its mark in a header the page cannot see: the splash eases back and fades.
          var e = doneAt >= 0 ? E.exit(seg(t, doneAt + P.pulse, doneAt + P.pulse + P.exit)) : 0;
          mark.setAttribute('transform', 'translate(128 128) scale(' + (1 - 0.08 * e) + ') translate(-128 -128)');
          el.style.opacity = 1 - e;
          return doneAt >= 0 && e >= 1;
        }
        function frame(now) {
          clock += last < 0 ? 0 : Math.min(now - last, 34);
          last = now;
          if (render(clock)) { el.remove(); return; }
          requestAnimationFrame(frame);
        }
        window.onlyshotsReady = function () {
          if (loaded) return;
          loaded = true;
          if (still) { el.style.transition = 'opacity 300ms'; el.style.opacity = 0; setTimeout(function () { el.remove(); }, 300); }
        };
        if (still) render(P.draw[1]); else requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
