<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnlyShots</title>
    <!-- Link preview for shared /open links: as index.html's. -->
    <meta name="description" content="Film espresso with the live graph from your machine and scale. Get the app, or edit in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OnlyShots" />
    <meta property="og:title" content="OnlyShots" />
    <meta property="og:description" content="Film espresso with the live graph from your machine and scale. Get the app, or edit in your browser." />
    <meta property="og:url" content="https://onlyshots.parez.dev/open" />
    <meta property="og:image" content="https://onlyshots.parez.dev/social/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An espresso shot pouring on a Gaggiuino, with its pressure, flow and weight graph beside it." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://onlyshots.parez.dev/social/og-16x9.jpg" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0b; color: #e8e6e1; font-family: system-ui, sans-serif; }
      main { padding: 32px 20px; }
      a { color: inherit; }
    </style>
    <script>
      // onlyshots.vercel.app/open opens the app where it is installed (App Links, Universal Links). Reaching this page
      // means it is not: send a phone to its store, anything else to the web editor.
      // The App Store id: also set in app/webApp/.../AppStores.kt and index.html's apple-itunes-app tag.
      var APP_STORE_ID = null;
      var ua = navigator.userAgent;
      var iphone = /iPhone|iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var target = "/";
      if (/Android/.test(ua)) target = "https://play.google.com/store/apps/details?id=dev.parez.onlyshots";
      else if (iphone && APP_STORE_ID) target = "https://apps.apple.com/app/id" + APP_STORE_ID;
      location.replace(target);
    </script>
  </head>
  <body>
    <main><a href="/">Open the OnlyShots web editor</a></main>
  </body>
</html>
