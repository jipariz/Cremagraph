<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">How OnlyShots works, in five steps</title>
  <desc id="d">Connect the machine and scale, arm the camera, brew (recording starts with the brew switch), edit the
    graph and the clip, then save or share the video. A shot's pressure trace runs over the steps.</desc>
  <defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#161616"/></pattern></defs>
  <rect width="1200" height="300" fill="#0B0B0B"/>
  <rect width="1200" height="300" fill="url(#g)"/>
  <path d="M48 70 H506 C566 70 586 30 646 30 H1122" fill="none" stroke="#FF5A1F" stroke-width="4"/>
  <rect x="1122" y="18" width="24" height="24" fill="#FF5A1F"/>
  <g>
    <rect x="48.5" y="96.5" width="207.0" height="175" fill="#111110" stroke="#3A3A38"/>
    <g fill="#FF5A1F"><rect x="43" y="91" width="10" height="10"/><rect x="43" y="267" width="10" height="10"/><rect x="251" y="91" width="10" height="10"/><rect x="251" y="267" width="10" height="10"/></g>
    <text x="66" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#FF5A1F" letter-spacing="1">01</text>
    <text x="66" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#E8E6E1" letter-spacing="1">CONNECT</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#A3A19B"><text x="66" y="204">Gaggiuino on</text><text x="66" y="230">Wi-Fi, a scale on</text><text x="66" y="256">Bluetooth.</text></g>
  </g><g>
    <rect x="272.5" y="96.5" width="207.0" height="175" fill="#111110" stroke="#3A3A38"/>
    <g fill="#FF5A1F"><rect x="267" y="91" width="10" height="10"/><rect x="267" y="267" width="10" height="10"/><rect x="475" y="91" width="10" height="10"/><rect x="475" y="267" width="10" height="10"/></g>
    <text x="290" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#FF5A1F" letter-spacing="1">02</text>
    <text x="290" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#E8E6E1" letter-spacing="1">ARM</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#A3A19B"><text x="290" y="204">The camera rolls;</text><text x="290" y="230">the first drops</text><text x="290" y="256">stay on film.</text></g>
  </g><g>
    <rect x="496.5" y="96.5" width="207.0" height="175" fill="#111110" stroke="#3A3A38"/>
    <g fill="#FF5A1F"><rect x="491" y="91" width="10" height="10"/><rect x="491" y="267" width="10" height="10"/><rect x="699" y="91" width="10" height="10"/><rect x="699" y="267" width="10" height="10"/></g>
    <text x="514" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#FF5A1F" letter-spacing="1">03</text>
    <text x="514" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#E8E6E1" letter-spacing="1">BREW</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#A3A19B"><text x="514" y="204">Starts with the</text><text x="514" y="230">brew switch, stops</text><text x="514" y="256">after the shot.</text></g>
  </g><g>
    <rect x="720.5" y="96.5" width="207.0" height="175" fill="#111110" stroke="#3A3A38"/>
    <g fill="#FF5A1F"><rect x="715" y="91" width="10" height="10"/><rect x="715" y="267" width="10" height="10"/><rect x="923" y="91" width="10" height="10"/><rect x="923" y="267" width="10" height="10"/></g>
    <text x="738" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#FF5A1F" letter-spacing="1">04</text>
    <text x="738" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#E8E6E1" letter-spacing="1">EDIT</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#A3A19B"><text x="738" y="204">Place the graph,</text><text x="738" y="230">pick a style,</text><text x="738" y="256">trim the clip.</text></g>
  </g><g>
    <rect x="944.5" y="96.5" width="207.0" height="175" fill="#111110" stroke="#3A3A38"/>
    <g fill="#FF5A1F"><rect x="939" y="91" width="10" height="10"/><rect x="939" y="267" width="10" height="10"/><rect x="1147" y="91" width="10" height="10"/><rect x="1147" y="267" width="10" height="10"/></g>
    <text x="962" y="132" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#FF5A1F" letter-spacing="1">05</text>
    <text x="962" y="166" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#E8E6E1" letter-spacing="1">SHARE</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#A3A19B"><text x="962" y="204">Save up to 4K,</text><text x="962" y="230">or share at 1080p</text><text x="962" y="256">anywhere.</text></g>
  </g>
</svg>
