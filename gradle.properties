org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
android.useAndroidX=true
android.nonTransitiveRClass=true


# Compose Hot Reload (the desktop development host) runs on the JetBrains Runtime; let its tasks
# download one instead of requiring a local install.
compose.reload.jbr.autoProvisioningEnabled=true

# The app's one version (semver), read by build-logic's appVersion. Change it with ./gradlew bumpVersion.
onlyshots.version=1.1.0
